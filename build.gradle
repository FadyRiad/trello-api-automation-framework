plugins {
    id 'java'
    id "com.github.spacialcircumstances.gradle-cucumber-reporting" version "0.1.25"
}

group 'com.fadyriad'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation(
            ['io.rest-assured:rest-assured:4.4.0'],
            ['io.rest-assured:json-schema-validator:4.4.0'],
            ['org.junit.jupiter:junit-jupiter-api:5.10.2'],
            ['org.junit.jupiter:junit-jupiter-engine:5.10.2'],
            ['org.junit.platform:junit-platform-launcher:1.10.2'],
            ['org.junit.jupiter:junit-jupiter-params:5.10.2'],
            ['io.cucumber:cucumber-java:7.15.0'],
            ['io.cucumber:cucumber-junit-platform-engine:7.15.0'],
            ['io.cucumber:cucumber-picocontainer:7.15.0'],
            ['org.junit.platform:junit-platform-suite-engine:1.10.2']
    )
}

test {
    useJUnitPlatform()

    systemProperty "trello.key", System.getenv("TRELLO_API_KEY")
    systemProperty "trello.token", System.getenv("TRELLO_API_TOKEN")

    testLogging {
        events "passed", "skipped", "failed"
    }

    finalizedBy 'generateCucumberReports'

}

cucumberReports {
    projectNameOverride = 'Cucumber BDD test project'
    outputDir = file('build/cucumber-report')
    reports = files('build/cucumber-report/json/cucumber-report.json')
}

